<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login - Grantee</title>
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/login-split.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body class="login-body-bg">
    <div class="login-split-layout">
        <div class="split-graphic-side student-accent-bg">
            <div class="brand-watermark">
                <div class="brand-header">
                    <img src="./assets/grantee_logo.png" alt="logo" class="logo-img">
                    <h2>Grantee</h2>
                </div>
                <p>Smart Scholarship Management System</p>
            </div>
            <!-- <div class="graphic-center-art">
                <img src="assets/hero-students.png" alt="Student Art" class="vector-art">
                <h3>Your journey to a<br>brighter future starts here.</h3>
            </div> -->
            <object type="image/svg+xml" data="assets/tablet-login-animate.svg" width="500" height="500">
            </object>
        </div>

        <div class="split-form-side">
            <div class="compact-form-box">
                <h3>Welcome Back!</h3>
                <p class="subtitle">Login to your Grantee account</p>

                <form id="student-login-form">
                    <div class="form-input-block">
                        <label>Email Address</label>
                        <input type="email" id="loginEmail" placeholder="Enter your email" required>
                    </div>
                    <div class="form-input-block">
                        <label>Password</label>
                        <div class="password-input-wrapper">
                            <input type="password" id="loginPassword" placeholder="Enter your password" required>
                            <span class="toggle-password" id="toggleLoginPassword"><i
                                    class="fa-regular fa-eye"></i></span>
                        </div>
                    </div>
                    <div class="form-utils-row">
                        <label><input type="checkbox"> Remember me</label>
                        <a href="#" class="forgot-password-link">Forgot Password?</a>
                    </div>
                    <button type="submit" class="btn-execute-login-action">Log in</button>


                    <p class="bottom-route-p">Don't have an account? <a href="student-register.html">Register as a
                            student</a></p>
                </form>
            </div>
        </div>
    </div>



    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/auth.js"></script>

</body>

</html>
