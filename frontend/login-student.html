<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Grantee</title>
    <link rel="icon" type="image/x-icon" href="assets/grantee_logo.png">

    <!-- Fonts and Lucide Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- Global & Page CSS -->
    <link rel="stylesheet" href="css/admin-global.css">
    <link rel="stylesheet" href="css/register.css">

    <!-- Enforce Light Theme for Login -->
    <script>
        document.documentElement.setAttribute('data-theme', 'light');
    </script>
</head>

<body class="bg-main text-main register-page-bg">

    <div class="split-layout">
        <div class="split-left">
            <div class="brand-header">
                <a href="index.html" class="brand-logo-container" style="text-decoration: none;">
                    <img src="./assets/grantee_logo.png" alt="Grantee Logo" style="width: 34px; height: 34px;">
                    <h1 class="brand-title">Grantee</h1>
                </a>
                <p class="brand-subtitle">Smart Scholarship Management System</p>
            </div>
            <div class="illustration-container">
                <img src="./assets/tablet-login-animate.svg" alt="Login Illustration">
            </div>
        </div>

        <div class="split-right">
            <div class="register-container">
                <div class="logo-area">
                    <div class="icon-circle">
                        <i data-lucide="log-in" style="width: 22px; height: 22px; stroke-width: 2.2;"></i>
                    </div>
                    <h2>Welcome Back!</h2>
                    <p>Login to your Grantee account</p>
                </div>

                <!-- Inline Alert Message Container -->
                <div id="loginAlert" class="inline-alert" style="display: none;" role="alert">
                    <div class="inline-alert-icon">
                        <i data-lucide="alert-circle" style="width: 18px; height: 18px; stroke-width: 2.2;"></i>
                    </div>
                    <div class="inline-alert-content">
                        <strong class="inline-alert-title" id="loginAlertTitle">Authentication Failed</strong>
                        <span class="inline-alert-message" id="loginAlertMessage">Invalid login credentials</span>
                    </div>
                    <button type="button" class="inline-alert-close" id="loginAlertClose" aria-label="Dismiss alert">
                        <i data-lucide="x" style="width: 15px; height: 15px; stroke-width: 2.2;"></i>
                    </button>
                </div>

                <form id="student-login-form">
                    <div class="input-group">
                        <label for="loginEmail">Email Address</label>
                        <input type="email" id="loginEmail" placeholder="Enter your email" required autocomplete="email">
                    </div>

                    <div class="input-group mt-20">
                        <label for="loginPassword">Password</label>
                        <div style="position: relative; display: flex; align-items: center;">
                            <input type="password" id="loginPassword" placeholder="Enter your password" required autocomplete="current-password"
                                style="width: 100%; padding-right: 44px;">
                            <span class="toggle-password" id="toggleLoginPassword"
                                style="position: absolute; right: 12px; cursor: pointer; user-select: none; display: flex; align-items: center; justify-content: center; color: var(--text-muted); transition: color 0.2s;"
                                title="Show Password"><i data-lucide="eye-off" style="width: 18px; height: 18px;"></i></span>
                        </div>
                    </div>

                    <div class="form-utils-row">
                        <label style="display: flex; align-items: center; gap: 8px; color: var(--text-muted); cursor: pointer; margin: 0; user-select: none;">
                            <input type="checkbox" id="rememberMe" style="margin: 0; cursor: pointer;"> 
                            Remember me
                        </label>
                        <a href="reset-password.html" class="forgot-password-link">Forgot Password?</a>
                    </div>

                    <button type="submit" class="btn-primary btn-submit btn-execute-login-action mt-24">
                        <span>Log in</span>
                    </button>
                </form>

                <p class="footer-text">
                    Don't have an account? <a href="student-register.html">Register as a student</a>
                </p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/auth.js"></script>
    <script src="js/keyboard-avoidance.js"></script>
    <script>
        if (typeof lucide !== 'undefined') {
            lucide.createIcons();
        }
    </script>
</body>

</html>
