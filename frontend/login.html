<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Grantee</title>
    <link rel="icon" type="image/x-icon" href="assets/grantee_logo.png">
    <link rel="stylesheet" href="css/admin-global.css">
    <link rel="stylesheet" href="css/register.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body class="bg-main text-main register-page-bg">

    <div class="split-layout">
        <div class="split-left">
            <div class="brand-header">
                <div class="brand-logo-container">
                    <img src="./assets/grantee_logo.png" alt="Grantee Logo" style="width: 32px; height: 32px;">
                    <h1 class="brand-title">Grantee</h1>
                </div>
                <p class="brand-subtitle">Smart Scholarship Management System</p>
            </div>
            <div class="illustration-container">
                <img src="./assets/tablet-login-animate.svg" alt="Login Illustration">
            </div>
        </div>

        <div class="split-right">
            <div class="register-container">
                <div class="logo-area">
                    <div class="icon-circle">
                        <i class="fa-solid fa-right-to-bracket" style="font-size: 20px;"></i>
                    </div>
                    <h2>Welcome Back!</h2>
                    <p>Login to your Grantee account</p>
                </div>

                <form id="student-login-form">
                    <div class="input-group">
                        <label>Email Address</label>
                        <input type="email" id="loginEmail" placeholder="Enter your email" required>
                    </div>

                    <div class="input-group mt-20">
                        <label>Password</label>
                        <div style="position: relative; display: flex; align-items: center;">
                            <input type="password" id="loginPassword" placeholder="Enter your password" required
                                style="width: 100%; padding-right: 40px;">
                            <span class="toggle-password" id="toggleLoginPassword"
                                style="position: absolute; right: 12px; cursor: pointer; user-select: none; font-size: 16px; opacity: 1; transition: opacity 0.2s; color: #64748b;"
                                title="Show Password"><i class="fa-regular fa-eye-slash"></i></span>
                        </div>
                    </div>

                    <div class="form-utils-row"
                        style="display: flex; justify-content: space-between; align-items: center; font-size: 13px; margin-top: 16px;">
                        <label style="display: flex; align-items: center; gap: 6px; color: var(--text-muted); cursor: pointer; margin: 0;">
                            <input type="checkbox" id="rememberMe" style="margin: 0; cursor: pointer;"> 
                            Remember me
                        </label>
                        <a href="reset-password.html" class="forgot-password-link"
                            style="color: var(--teal-dark); font-weight: 600; text-decoration: none; margin: 0;">Forgot
                            Password?</a>
                    </div>

                    <button type="submit" class="btn-primary btn-submit btn-execute-login-action mt-24">Log in</button>
                </form>

                <p class="footer-text">
                    Don't have an account? <a href="student-register.html">Register as a student</a>
                </p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/auth.js"></script>
    <script src="js/keyboard-avoidance.js"></script>
</body>

</html>
