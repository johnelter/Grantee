<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password - Grantee</title>
    <link rel="icon" type="image/x-icon" href="assets/grantee_logo.png">

    <!-- Fonts and Lucide Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Global & Page CSS -->
    <link rel="stylesheet" href="css/admin-global.css">
    <link rel="stylesheet" href="css/register.css">

    <!-- Enforce Light Theme for Reset Password -->
    <script>
        document.documentElement.setAttribute('data-theme', 'light');
    </script>
</head>

<body class="bg-main text-main register-page-bg">

    <div class="split-layout">
        <div class="split-left">
            <div class="brand-header">
                <a href="index.html" class="brand-logo-container" style="text-decoration: none;">
                    <img src="./assets/grantee_logo.png" alt="Grantee Logo" style="width: 34px; height: 34px;">
                    <h1 class="brand-title">Grantee</h1>
                </a>
                <p class="brand-subtitle">Smart Scholarship Management System</p>
            </div>
            <div class="illustration-container">
                <img src="./assets/forgot-password-animate.svg" alt="Reset Password Illustration">
            </div>
        </div>

        <div class="split-right">
            <div class="register-container">
                <div class="logo-area">
                    <div class="icon-circle">
                        <i data-lucide="key-round" style="width: 22px; height: 22px; stroke-width: 2.2;"></i>
                    </div>
                    <h2>Set New Password</h2>
                    <p>Please enter your new password below.</p>
                </div>

                <!-- Inline Alert Message Container -->
                <div id="resetAlert" class="inline-alert" style="display: none;" role="alert">
                    <div class="inline-alert-icon">
                        <i data-lucide="alert-circle" style="width: 18px; height: 18px; stroke-width: 2.2;"></i>
                    </div>
                    <div class="inline-alert-content">
                        <strong class="inline-alert-title" id="resetAlertTitle">Weak Password</strong>
                        <div class="inline-alert-message" id="resetAlertMessage"></div>
                    </div>
                    <button type="button" class="inline-alert-close" id="resetAlertClose" aria-label="Dismiss alert">
                        <i data-lucide="x" style="width: 15px; height: 15px; stroke-width: 2.2;"></i>
                    </button>
                </div>

                <form id="reset-password-form">
                    <div class="input-group">
                        <label for="new-password">New Password</label>
                        <div style="position: relative; display: flex; align-items: center;">
                            <input type="password" id="new-password" placeholder="Create a strong password" required
                                minlength="8" autocomplete="new-password" style="width: 100%; padding-right: 44px;">
                            <span class="toggle-password" id="toggleNewPassword" data-target="new-password"
                                style="position: absolute; right: 12px; cursor: pointer; user-select: none; display: flex; align-items: center; justify-content: center; color: var(--text-muted); transition: color 0.2s;"
                                title="Show Password"><i data-lucide="eye-off" style="width: 18px; height: 18px;"></i></span>
                        </div>
                    </div>

                    <div class="input-group mt-20">
                        <label for="confirm-password">Confirm New Password</label>
                        <div style="position: relative; display: flex; align-items: center;">
                            <input type="password" id="confirm-password" placeholder="Retype your new password" required
                                minlength="8" autocomplete="new-password" style="width: 100%; padding-right: 44px;">
                            <span class="toggle-password" id="toggleConfirmPassword" data-target="confirm-password"
                                style="position: absolute; right: 12px; cursor: pointer; user-select: none; display: flex; align-items: center; justify-content: center; color: var(--text-muted); transition: color 0.2s;"
                                title="Show Password"><i data-lucide="eye-off" style="width: 18px; height: 18px;"></i></span>
                        </div>
                    </div>

                    <button type="submit" class="btn-primary btn-submit btn-execute-login-action mt-24"
                        id="update-btn">
                        <span>Update Password</span>
                    </button>
                </form>

                <p class="footer-text">
                    Remembered your password? <a href="login.html">Back to Login</a>
                </p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/keyboard-avoidance.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {

            // Initialize Lucide icons
            if (typeof lucide !== 'undefined') {
                lucide.createIcons();
            }

            // Inline Alert Functions
            const showInlineAlert = (type, title, messageHtmlOrText) => {
                const alertEl = document.getElementById('resetAlert');
                if (!alertEl) return;

                const titleEl = document.getElementById('resetAlertTitle');
                const messageEl = document.getElementById('resetAlertMessage');
                const iconContainer = alertEl.querySelector('.inline-alert-icon');
                const closeBtn = document.getElementById('resetAlertClose');

                if (titleEl) titleEl.innerText = title;
                if (messageEl) {
                    if (typeof messageHtmlOrText === 'string' && messageHtmlOrText.includes('<')) {
                        messageEl.innerHTML = messageHtmlOrText;
                    } else {
                        messageEl.innerText = messageHtmlOrText || '';
                    }
                }

                alertEl.classList.remove('inline-alert-error', 'inline-alert-warning', 'inline-alert-info', 'inline-alert-success');
                alertEl.classList.add(`inline-alert-${type || 'error'}`);

                let lucideIcon = 'alert-circle';
                if (type === 'success') lucideIcon = 'check-circle-2';
                if (type === 'warning') lucideIcon = 'alert-triangle';
                if (type === 'info') lucideIcon = 'info';

                if (iconContainer) {
                    iconContainer.innerHTML = `<i data-lucide="${lucideIcon}" style="width: 18px; height: 18px; stroke-width: 2.2;"></i>`;
                }

                if (closeBtn && !closeBtn.querySelector('svg, i')) {
                    closeBtn.innerHTML = `<i data-lucide="x" style="width: 15px; height: 15px; stroke-width: 2.2;"></i>`;
                }

                alertEl.style.display = 'flex';
                alertEl.classList.add('show');

                // Re-trigger shake animation
                alertEl.classList.remove('shake');
                void alertEl.offsetWidth;
                alertEl.classList.add('shake');

                if (typeof lucide !== 'undefined') {
                    lucide.createIcons();
                }

                if (closeBtn) {
                    closeBtn.onclick = (e) => {
                        e.preventDefault();
                        hideInlineAlert();
                    };
                }
            };

            const hideInlineAlert = () => {
                const alertEl = document.getElementById('resetAlert');
                if (alertEl) {
                    alertEl.style.display = 'none';
                    alertEl.classList.remove('show', 'shake');
                }
            };

            // Password Visibility Toggle Logic
            const toggleIcons = document.querySelectorAll('.toggle-password');
            toggleIcons.forEach(toggleBtn => {
                toggleBtn.addEventListener('click', function () {
                    const targetId = this.getAttribute('data-target');
                    const inputField = document.getElementById(targetId);
                    if (inputField) {
                        const isPassword = inputField.getAttribute('type') === 'password';
                        inputField.setAttribute('type', isPassword ? 'text' : 'password');

                        if (isPassword) {
                            this.innerHTML = '<i data-lucide="eye" style="width: 18px; height: 18px;"></i>';
                            this.setAttribute('title', 'Hide Password');
                        } else {
                            this.innerHTML = '<i data-lucide="eye-off" style="width: 18px; height: 18px;"></i>';
                            this.setAttribute('title', 'Show Password');
                        }

                        if (typeof lucide !== 'undefined') {
                            lucide.createIcons();
                        }
                    }
                });
            });

            // Auto-dismiss inline alert on input typing
            const inputs = document.querySelectorAll('#new-password, #confirm-password');
            inputs.forEach(input => {
                input.addEventListener('input', () => {
                    hideInlineAlert();
                });
            });

            // Form Submit Handler
            const resetForm = document.getElementById('reset-password-form');
            if (resetForm) {
                resetForm.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    hideInlineAlert();

                    const newPass = document.getElementById('new-password').value;
                    const confirmPass = document.getElementById('confirm-password').value;
                    const btn = document.getElementById('update-btn');

                    if (newPass !== confirmPass) {
                        showInlineAlert('warning', 'Passwords Mismatch', 'The passwords you entered do not match. Please try again.');
                        return;
                    }

                    const strongPasswordRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[\W_])[A-Za-z\d\W_]{8,}$/;
                    if (!strongPasswordRegex.test(newPass)) {
                        showInlineAlert('warning', 'Weak Password', `Password must be at least 8 characters long and contain:
                            <ul style="margin: 6px 0 0 16px; padding: 0; list-style-type: disc;">
                                <li>One uppercase letter (A-Z)</li>
                                <li>One lowercase letter (a-z)</li>
                                <li>One number (0-9)</li>
                                <li>One special character (e.g., !@#$%^&*)</li>
                            </ul>`);
                        return;
                    }

                    const originalBtnHtml = btn.innerHTML;
                    btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> <span>Updating...</span>';
                    btn.disabled = true;

                    try {
                        const { error } = await window.supabaseClient.auth.updateUser({
                            password: newPass
                        });

                        if (error) throw error;

                        showInlineAlert('success', 'Password Updated!', 'Your password has been updated successfully! Redirecting you to login...');

                        setTimeout(() => {
                            window.location.href = 'login.html';
                        }, 2000);

                    } catch (error) {
                        console.error(error);
                        showInlineAlert('error', 'Error Updating Password', error.message ? (error.message + '. The reset link may have expired. Please request a new link from the login page.') : 'Failed to update password. The reset link may have expired.');
                        btn.innerHTML = originalBtnHtml;
                        btn.disabled = false;
                        if (typeof lucide !== 'undefined') {
                            lucide.createIcons();
                        }
                    }
                });
            }
        });
    </script>
</body>

</html>
