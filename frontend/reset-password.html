<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password - Grantee</title>
    <link rel="stylesheet" href="css/admin-global.css">
    <link rel="stylesheet" href="css/register.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body class="bg-main text-main register-page-bg">

    <div class="split-layout">
        <div class="split-left">
            <div class="brand-header">
                <div class="brand-logo-container">
                    <img src="./assets/grantee_logo.png" alt="Grantee Logo" style="width: 32px; height: 32px;">
                    <h1 class="brand-title">Grantee</h1>
                </div>
                <p class="brand-subtitle">Smart Scholarship Management System</p>
            </div>
            <div class="illustration-container">
                <img src="./assets/forgot-password-animate.svg" alt="Reset Password Illustration">
            </div>
        </div>
        
        <div class="split-right">
            <div class="register-container">
                <div class="logo-area">
                    <div class="icon-circle">
                        <i class="fa-solid fa-lock" style="font-size: 20px;"></i>
                    </div>
                    <h2>Set New Password</h2>
                    <p>Please enter your new password below.</p>
                </div>

                <form id="reset-password-form">
                    <div class="input-group">
                        <label>New Password</label>
                        <div style="position: relative; display: flex; align-items: center;">
                            <input type="password" id="new-password" placeholder="Create a strong password" required minlength="8"
                                style="width: 100%; padding-right: 40px;">
                            <span class="toggle-password" data-target="new-password"
                                style="position: absolute; right: 12px; cursor: pointer; user-select: none; font-size: 16px; opacity: 1; transition: opacity 0.2s; color: #64748b;"
                                title="Show Password"><i class="fa-regular fa-eye-slash"></i></span>
                        </div>
                    </div>

                    <div class="input-group mt-20">
                        <label>Confirm New Password</label>
                        <div style="position: relative; display: flex; align-items: center;">
                            <input type="password" id="confirm-password" placeholder="Retype your new password" required minlength="8"
                                style="width: 100%; padding-right: 40px;">
                            <span class="toggle-password" data-target="confirm-password"
                                style="position: absolute; right: 12px; cursor: pointer; user-select: none; font-size: 16px; opacity: 1; transition: opacity 0.2s; color: #64748b;"
                                title="Show Password"><i class="fa-regular fa-eye-slash"></i></span>
                        </div>
                    </div>

                    <button type="submit" class="btn-primary btn-submit btn-execute-login-action mt-24" id="update-btn">Update Password</button>
                </form>

                <p class="footer-text">
                    Remembered your password? <a href="login.html">Back to Login</a>
                </p>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            
            // Password Visibility Toggle Logic
            const toggleIcons = document.querySelectorAll('.toggle-password');
            toggleIcons.forEach(icon => {
                icon.addEventListener('click', function() {
                    const targetId = this.getAttribute('data-target');
                    const inputField = document.getElementById(targetId);
                    if (inputField) {
                        const iTag = this.querySelector('i');
                        if (inputField.type === 'password') {
                            inputField.type = 'text';
                            if (iTag) {
                                iTag.classList.remove('fa-eye-slash');
                                iTag.classList.add('fa-eye');
                            }
                            this.title = "Hide Password";
                        } else {
                            inputField.type = 'password';
                            if (iTag) {
                                iTag.classList.remove('fa-eye');
                                iTag.classList.add('fa-eye-slash');
                            }
                            this.title = "Show Password";
                        }
                    }
                });
            });

            const resetForm = document.getElementById('reset-password-form');
            
            if (resetForm) {
                resetForm.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    
                    const newPass = document.getElementById('new-password').value;
                    const confirmPass = document.getElementById('confirm-password').value;
                    const btn = document.getElementById('update-btn');

                    if (newPass !== confirmPass) {
                        Swal.fire({
                            title: 'Passwords Mismatch',
                            text: 'The passwords you entered do not match. Please try again.',
                            icon: 'warning',
                            confirmButtonColor: '#10b981'
                        });
                        return;
                    }

                    const strongPasswordRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[\W_])[A-Za-z\d\W_]{8,}$/;
                    if (!strongPasswordRegex.test(newPass)) {
                        Swal.fire({
                            title: 'Weak Password',
                            html: 'Password must be at least 8 characters long and contain:<br><br>• One uppercase letter (A-Z)<br>• One lowercase letter (a-z)<br>• One number (0-9)<br>• One special character (e.g., !@#$%^&*)',
                            icon: 'warning',
                            confirmButtonColor: '#10b981'
                        });
                        return;
                    }

                    btn.innerText = "Updating...";
                    btn.disabled = true;

                    try {
                        const { error } = await window.supabaseClient.auth.updateUser({
                            password: newPass
                        });

                        if (error) throw error;

                        Swal.fire({
                            title: 'Success!',
                            text: 'Password updated successfully! You can now log in with your new password.',
                            icon: 'success',
                            confirmButtonText: 'Login Now',
                            confirmButtonColor: '#10b981'
                        }).then(() => {
                            window.location.href = 'login.html';
                        });
                        
                    } catch (error) {
                        console.error(error);
                        Swal.fire({
                            title: 'Error',
                            text: "Error updating password: " + error.message + "\n\nThe reset link may have expired. Please request a new one from the login page.",
                            icon: 'error',
                            confirmButtonColor: '#10b981'
                        });
                        btn.innerText = "Update Password";
                        btn.disabled = false;
                    }
                });
            }
        });
    </script>
    <script src="js/keyboard-avoidance.js"></script>
</body>
</html>
