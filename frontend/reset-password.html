<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password - Grantee</title>
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/login-split.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <div class="login-split-layout">
        
        <div class="split-graphic-side student-accent-bg">
            <div class="brand-watermark">
                <h2><i class="fa-solid fa-shield-halved"></i> Grantee</h2>
                <p>Smart Scholarship Management System</p>
            </div>
            <div class="graphic-center-art">
                <img src="assets/hero-students.png" alt="Secure Account Art" class="vector-art">
                <h3>Secure your account.<br>Resume your journey.</h3>
            </div>
        </div>

        <div class="split-form-side">
            <div class="compact-form-box">
                <div style="font-size: 40px; margin-bottom: 15px; color: #10b981;"><i class="fa-solid fa-lock"></i></div>
                <h3>Set New Password</h3>
                <p class="subtitle">Please enter your new password below.</p>

                <form id="reset-password-form">
                    <div class="form-input-block">
                        <label>New Password</label>
                        <div class="password-input-wrapper">
                            <input type="password" id="new-password" placeholder="Create a strong password" required minlength="8">
                            <span class="toggle-password" data-target="new-password"><i class="fa-regular fa-eye-slash"></i></span>
                        </div>
                    </div>
                    <div class="form-input-block">
                        <label>Confirm New Password</label>
                        <div class="password-input-wrapper">
                            <input type="password" id="confirm-password" placeholder="Retype your new password" required minlength="8">
                            <span class="toggle-password" data-target="confirm-password"><i class="fa-regular fa-eye-slash"></i></span>
                        </div>
                    </div>
                    
                    <button type="submit" class="btn-execute-login-action" id="update-btn" style="margin-top: 20px;">Update Password</button>
                    
                    <p class="bottom-route-p" style="margin-top: 30px;">
                        Remembered your password? <a href="login.html">Back to Login</a>
                    </p>
                </form>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            
            // Password Visibility Toggle Logic
            const toggleIcons = document.querySelectorAll('.toggle-password');
            toggleIcons.forEach(icon => {
                icon.addEventListener('click', function() {
                    const targetId = this.getAttribute('data-target');
                    const inputField = document.getElementById(targetId);
                    if (inputField) {
                        const iTag = this.querySelector('i');
                        if (inputField.type === 'password') {
                            inputField.type = 'text';
                            if (iTag) {
                                iTag.classList.remove('fa-eye-slash');
                                iTag.classList.add('fa-eye');
                            }
                            this.title = "Hide Password";
                        } else {
                            inputField.type = 'password';
                            if (iTag) {
                                iTag.classList.remove('fa-eye');
                                iTag.classList.add('fa-eye-slash');
                            }
                            this.title = "Show Password";
                        }
                    }
                });
            });

            const resetForm = document.getElementById('reset-password-form');
            
            if (resetForm) {
                resetForm.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    
                    const newPass = document.getElementById('new-password').value;
                    const confirmPass = document.getElementById('confirm-password').value;
                    const btn = document.getElementById('update-btn');

                    if (newPass !== confirmPass) {
                        Swal.fire({
                            title: 'Passwords Mismatch',
                            text: 'The passwords you entered do not match. Please try again.',
                            icon: 'warning',
                            confirmButtonColor: '#10b981'
                        });
                        return;
                    }

                    const strongPasswordRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[\W_])[A-Za-z\d\W_]{8,}$/;
                    if (!strongPasswordRegex.test(newPass)) {
                        Swal.fire({
                            title: 'Weak Password',
                            html: 'Password must be at least 8 characters long and contain:<br><br>• One uppercase letter (A-Z)<br>• One lowercase letter (a-z)<br>• One number (0-9)<br>• One special character (e.g., !@#$%^&*)',
                            icon: 'warning',
                            confirmButtonColor: '#10b981'
                        });
                        return;
                    }

                    btn.innerText = "Updating...";
                    btn.disabled = true;

                    try {
                        const { error } = await window.supabaseClient.auth.updateUser({
                            password: newPass
                        });

                        if (error) throw error;

                        Swal.fire({
                            title: 'Success!',
                            text: 'Password updated successfully! You can now log in with your new password.',
                            icon: 'success',
                            confirmButtonText: 'Login Now',
                            confirmButtonColor: '#10b981'
                        }).then(() => {
                            window.location.href = 'login.html';
                        });
                        
                    } catch (error) {
                        console.error(error);
                        Swal.fire({
                            title: 'Error',
                            text: "Error updating password: " + error.message + "\n\nThe reset link may have expired. Please request a new one from the login page.",
                            icon: 'error',
                            confirmButtonColor: '#10b981'
                        });
                        btn.innerText = "Update Password";
                        btn.disabled = false;
                    }
                });
            }
        });
    </script>
</body>
</html>
