<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password - Grantee</title>
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/login-split.css">
</head>
<body>
    <div class="login-split-layout">
        
        <div class="split-graphic-side student-accent-bg">
            <div class="brand-watermark">
                <h2>🛡️ Grantee</h2>
                <p>Smart Scholarship Management System</p>
            </div>
            <div class="graphic-center-art">
                <img src="assets/hero-students.png" alt="Secure Account Art" class="vector-art">
                <h3>Secure your account.<br>Resume your journey.</h3>
            </div>
        </div>

        <div class="split-form-side">
            <div class="compact-form-box">
                <div style="font-size: 40px; margin-bottom: 15px;">🔐</div>
                <h3>Set New Password</h3>
                <p class="subtitle">Please enter your new password below.</p>

                <form id="reset-password-form">
                    <div class="form-input-block">
                        <label>New Password</label>
                        <input type="password" id="new-password" placeholder="Minimum 6 characters" required minlength="6">
                    </div>
                    <div class="form-input-block">
                        <label>Confirm New Password</label>
                        <input type="password" id="confirm-password" placeholder="Retype your new password" required minlength="6">
                    </div>
                    
                    <button type="submit" class="btn-execute-login-action" id="update-btn" style="margin-top: 20px;">Update Password</button>
                    
                    <p class="bottom-route-p" style="margin-top: 30px;">
                        Remembered your password? <a href="login-student.html">Back to Login</a>
                    </p>
                </form>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const resetForm = document.getElementById('reset-password-form');
            
            if (resetForm) {
                resetForm.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    
                    const newPass = document.getElementById('new-password').value;
                    const confirmPass = document.getElementById('confirm-password').value;
                    const btn = document.getElementById('update-btn');

                    if (newPass !== confirmPass) {
                        alert("Passwords do not match!");
                        return;
                    }

                    btn.innerText = "Updating...";
                    btn.disabled = true;

                    try {
                        // Supabase automatically detects the access token in the URL hash
                        // when the user is redirected here from their email link.
                        const { error } = await window.supabaseClient.auth.updateUser({
                            password: newPass
                        });

                        if (error) throw error;

                        alert("Password updated successfully! You can now log in with your new password.");
                        window.location.href = 'login-student.html';
                        
                    } catch (error) {
                        console.error(error);
                        alert("Error updating password: " + error.message + "\n\nThe reset link may have expired. Please request a new one from the login page.");
                        btn.innerText = "Update Password";
                        btn.disabled = false;
                    }
                });
            }
        });
    </script>
</body>
</html>
