<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Announcements - Grantee Student</title>
    <link rel="icon" type="image/x-icon" href="assets/grantee_logo.png">
    <!-- External Fonts & Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- Standalone CSS Sheets -->
    <link rel="stylesheet" href="css/student-announcements.css">
</head>

<body class="bg-main text-main">
    <div class="app-layout">

        <!-- DYNAMIC SIDEBAR INJECTION POINT -->
        <div id="sidebar-container"></div>

        <main class="main-content">
            <!-- Ensure content-wrapper naturally expands -->
            <div class="content-wrapper" style="display: flex; flex-direction: column; height: 100%;">

                <header class="top-header">
                    <!-- TOP ROW: Actions & Mobile Menu -->
                    <div class="header-actions">

                        <!-- Left Side: Profile Dropdown -->
                        <div class="user-profile dropdown-toggle" id="profile-dropdown-toggle">
                            <img id="header-avatar" src="assets/default-avatar.png" alt="Profile"
                                onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2250%22 fill=%22%23e2e8f0%22/><path d=%22M50 25a15 15 0 110 30 15 15 0 010-30zm0 35c-20 0-35 10-35 25v5h70v-5c0-15-15-25-35-25z%22 fill=%22%2364748b%22/></svg>'">

                            <div class="profile-info">
                                <strong id="header-name">Student Name</strong>
                                <span id="header-program">Program</span>
                            </div>
                            <span class="dropdown-arrow"><i class="fa-solid fa-caret-down"></i></span>

                            <div class="profile-dropdown-menu" id="profile-menu">
                                <a href="profile-settings.html"><i class="fa-solid fa-user icon-margin"
                                        style="margin-right: 8px;"></i> Profile Settings</a>
                                <div class="dropdown-divider"></div>
                                <a href="#" id="dropdown-logout-btn" class="text-red logout-trigger"><i
                                        class="fa-solid fa-right-from-bracket" style="margin-right: 8px;"></i>
                                    Logout</a>
                            </div>
                        </div>

                        <!-- Right Side: Notifications & Hamburger -->
                        <div class="mobile-right-actions">
                            <div class="notification-wrapper">
                                <button class="btn-notification" id="notification-bell" type="button">
                                    <i class="fa-regular fa-bell" style="font-size: 22px;"></i>
                                    <span class="badge" id="notification-badge" style="display:none;">0</span>
                                </button>

                                <div id="notification-dropdown" class="notification-dropdown" style="display: none;">
                                    <div class="notification-header">
                                        <strong>Notifications</strong>
                                    </div>
                                    <div id="notification-list" class="notification-list-body">
                                    </div>
                                </div>
                            </div>

                            <!-- HAMBURGER BUTTON (Mobile Only) -->
                            <button type="button" class="hamburger-btn" id="mobile-menu-toggle">
                                <i class="fa-solid fa-bars"></i>
                            </button>
                        </div>
                    </div>

                    <!-- BOTTOM ROW: Titles -->
                    <div class="header-titles-wrapper">
                        <div class="header-titles">
                            <h1>Announcements</h1>
                            <p>Stay updated with the latest news and important updates.</p>
                        </div>
                    </div>
                </header>

                <div class="three-column-grid">

                    <!-- COLUMN 1: FEED -->
                    <div class="feed-column">
                        <div class="tabs-nav">
                            <button class="tab-btn active">All</button>
                            <button class="tab-btn">General</button>
                            <button class="tab-btn">Educational Assistance</button>
                            <button class="tab-btn">Reminder</button>
                            <button class="tab-btn">Event</button>
                        </div>
                        <div class="search-filter-row">
                            <div class="search-box">
                                <i class="fa-solid fa-magnifying-glass search-icon"></i>
                                <input type="text" id="search-input" placeholder="Search announcements...">
                            </div>
                        </div>
                        <div class="feed-list" id="announcements-list-container">
                            <div class="text-center text-muted loading-padded">
                                <i class="fa-solid fa-circle-notch fa-spin"></i> Loading...
                            </div>
                        </div>
                    </div>

                    <!-- COLUMN 2: DETAILS -->
                    <div class="detail-column">
                        <div class="detail-pane hidden padded-pane" id="detail-pane">
                            <div id="detail-content-container">
                                <!-- Dynamic Post Details Injected Here -->
                            </div>
                        </div>
                        <div class="detail-pane empty-state-pane" id="empty-pane">
                            <div>
                                <div class="empty-icon"><i class="fa-solid fa-bullhorn" style="color: #cbd5e1;"></i>
                                </div>
                                <p>Select an announcement to view details.</p>
                            </div>
                        </div>
                    </div>

                    <!-- COLUMN 3: COMMENTS & CHAT -->
                    <div class="detail-column" id="comments-column">
                        <!-- COMMENTS PANE -->
                        <div class="detail-pane no-padding flex-col-pane">
                            <div class="comments-header">
                                <h3 id="comments-count-header">Comments (0)</h3>
                            </div>
                            <div class="feed-list comments-body" id="comments-list-container">
                                <div class="text-center text-muted" style="padding: 20px;">
                                    <i class="fa-solid fa-circle-notch fa-spin"></i> Loading...
                                </div>
                            </div>
                            <div id="comment-input-area" class="comment-input-area">
                                <input type="text" id="student-comment-input" placeholder="Write a comment...">
                                <button id="btn-send-comment" class="btn-send-comment">
                                    <i class="fa-solid fa-paper-plane"></i>
                                </button>
                            </div>
                        </div>
                    </div>

                </div>

            </div>
        </main>
    </div>

    <!-- MATCHING LOGOUT MODAL -->
    <div id="logout-modal" class="global-modal-overlay" style="display: none; z-index: 99999;">
        <div class="global-modal-content">
            <div class="global-modal-icon">
                <i class="fa-solid fa-right-from-bracket"></i>
            </div>
            <h3>Logout</h3>
            <p>Are you sure you want to log out of the Student Dashboard?</p>
            <div class="global-modal-actions">
                <button id="modal-cancel" class="global-btn-cancel">Cancel</button>
                <button id="modal-confirm" class="global-btn-confirm">
                    <i class="fa-solid fa-power-off" style="margin-right: 5px;"></i> Logout
                </button>
            </div>
        </div>
    </div>

    <div id="modal-root"></div>

    <!-- MOBILE SIDEBAR OVERLAY -->
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <!-- DEPENDENCIES & SCRIPTS -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/components/ai-assistant.js"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/sidebar-loader.js"></script>
    <script src="js/student-announcements.js"></script>
    <script src="js/components/student-notifications.js"></script>

    <!-- UI TOGGLE SCRIPT -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const mobileMenuToggle = document.getElementById('mobile-menu-toggle');
            const sidebarOverlay = document.getElementById('sidebar-overlay');
            const profileToggle = document.getElementById('profile-dropdown-toggle');
            const profileMenu = document.getElementById('profile-menu');

            // Sidebar logic
            function closeSidebar(e) {
                if (e && e.cancelable) e.preventDefault();
                const sidebar = document.querySelector('.sidebar');
                if (sidebar) sidebar.classList.remove('show');
                if (sidebarOverlay) sidebarOverlay.classList.remove('show');
            }

            if (mobileMenuToggle) {
                mobileMenuToggle.addEventListener('click', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    const sidebar = document.querySelector('.sidebar');
                    if (sidebar) sidebar.classList.toggle('show');
                    if (sidebarOverlay) sidebarOverlay.classList.toggle('show');
                });
            }

            if (sidebarOverlay) {
                sidebarOverlay.addEventListener('click', closeSidebar);
                sidebarOverlay.addEventListener('touchstart', closeSidebar, { passive: false });
            }

            // Simple logout modal logic integration
            const logoutBtn = document.getElementById('dropdown-logout-btn');
            const logoutModal = document.getElementById('logout-modal');
            const modalCancel = document.getElementById('modal-cancel');
            const modalConfirm = document.getElementById('modal-confirm');

            if (logoutBtn && logoutModal) {
                logoutBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    logoutModal.style.display = 'flex';
                    if (profileMenu) profileMenu.classList.remove('show');
                });
                modalCancel.addEventListener('click', () => logoutModal.style.display = 'none');
                logoutModal.addEventListener('click', (e) => { if (e.target === logoutModal) logoutModal.style.display = 'none'; });

                modalConfirm.addEventListener('click', async () => {
                    modalConfirm.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Logging out...';
                    await window.supabaseClient.auth.signOut();
                    window.location.href = 'login.html';
                });
            }
        });
    </script>
</body>

</html>
