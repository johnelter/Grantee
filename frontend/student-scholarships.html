<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Available Educational Assistance - Grantee Student</title>
    
    <!-- Unified Styles -->
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/student-styles.css">
    <link rel="stylesheet" href="css/student-scholarships.css">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <style>
        .swal2-container { z-index: 99999 !important; }
        
        /* Mobile Header Adjustments */
        @media (max-width: 768px) {
            .top-header { flex-direction: column; align-items: stretch; gap: 15px; }
            .header-actions { width: 100%; justify-content: flex-end; }
            .hamburger-btn { display: flex !important; }
            .right-panel { display: none; } /* Hide filters panel on very small screens, or make it a drawer */
        }

        /* Explicit Button Styles for the Assistance Cards */
        .btn-action {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
        }

        .btn-action.btn-primary {
            background-color: var(--primary-color, #10b981);
            color: #ffffff;
            border: 1px solid var(--primary-color, #10b981);
            box-shadow: 0 4px 6px -1px rgba(16, 185, 129, 0.2);
        }
        .btn-action.btn-primary:hover {
            background-color: var(--primary-hover, #059669);
            border-color: var(--primary-hover, #059669);
            transform: translateY(-1px);
        }

        .btn-action.btn-outline {
            background-color: transparent;
            color: var(--primary-color, #10b981);
            border: 1px solid var(--primary-color, #10b981);
        }
        .btn-action.btn-outline:hover {
            background-color: rgba(16, 185, 129, 0.05);
        }

        .btn-action.btn-warning {
            background-color: #fef3c7;
            color: #d97706;
            border: 1px solid #fde68a;
        }
        .btn-action.btn-warning:hover {
            background-color: #fde68a;
        }

        .btn-action.btn-disabled {
            background-color: #f1f5f9;
            color: #94a3b8;
            border: 1px solid #e2e8f0;
            cursor: not-allowed;
        }
        .btn-action.btn-disabled:hover {
            transform: none;
        }
    </style>
</head>

<body class="bg-main text-main">
    <div class="app-layout">

        <!-- DYNAMIC SIDEBAR INJECTION POINT -->
        <div id="sidebar-container"></div>

        <main class="main-content">
            <div class="content-wrapper">

                <header class="top-header">
                    
                    <div class="header-actions">
                        
                        <div class="notification-bell" aria-label="Notifications" style="width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--border-color); background: #fff; color: var(--text-main); display: flex; align-items: center; justify-content: center; position: relative;">
                            <i class="fa-regular fa-bell"></i>
                            <span class="badge" style="position: absolute; top: -2px; right: -2px; background: var(--danger-color); color: #fff; font-size: 10px; font-weight: 700; width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; border-radius: 50%; border: 2px solid #fff;">2</span>
                        </div>

                        <div class="user-profile dropdown-toggle" id="profile-dropdown-toggle" role="button" aria-expanded="false" aria-controls="profile-menu" tabindex="0" style="display: flex; align-items: center; gap: 12px; cursor: pointer; padding: 6px 16px 6px 6px; border-radius: 30px; border: 1px solid var(--border-color); background: #fff; position: relative;">
                            <img id="header-avatar" src="assets/default-avatar.png" alt="Profile" class="avatar-img" style="width: 36px; height: 36px; border-radius: 50%; object-fit: cover;" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2250%22 fill=%22%23e2e8f0%22/><text x=%2250%22 y=%2250%22 dominant-baseline=%22middle%22 text-anchor=%22middle%22 font-size=%2240%22 fill=%22%2364748b%22>👤</text></svg>'">
                            <div class="profile-info">
                                <strong id="header-name" style="display: block; font-size: 14px; color: var(--text-main);">Loading...</strong>
                                <span id="header-program" style="display: block; font-size: 12px; color: var(--text-muted);">Student Profile</span>
                            </div>
                            <span class="dropdown-arrow" style="font-size: 12px; color: var(--text-muted);"><i class="fa-solid fa-caret-down"></i></span>

                            <div class="profile-dropdown-menu" id="profile-menu" aria-hidden="true" style="position: absolute; top: 115%; right: 0; background: #fff; border: 1px solid var(--border-color); border-radius: 8px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); min-width: 200px; padding: 8px 0; display: none; flex-direction: column; z-index: 100;">
                                <a href="student-profile-settings.html" style="padding: 10px 20px; color: var(--text-main); font-size: 14px; font-weight: 500; text-decoration: none; display: flex; align-items: center;"><i class="fa-solid fa-user" style="margin-right: 8px;"></i> Profile Settings</a>
                                <div class="dropdown-divider" style="height: 1px; background: var(--border-color); margin: 4px 0;"></div>
                                <a href="#" id="dropdown-logout-btn" class="text-red logout-trigger" style="padding: 10px 20px; color: #ef4444; font-size: 14px; font-weight: 500; text-decoration: none; display: flex; align-items: center;"><i class="fa-solid fa-right-from-bracket" style="margin-right: 8px;"></i> Logout</a>
                            </div>
                        </div>

                        <!-- Hamburger Menu for Mobile -->
                        <button type="button" class="hamburger-btn" id="mobile-menu-toggle" style="display: none; background: none; border: none; font-size: 20px; color: var(--text-main); cursor: pointer; padding: 6px; width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--border-color); background: #fff;">
                            <i class="fa-solid fa-bars"></i>
                        </button>
                    </div>

                    <div class="header-titles">
                        <h1>Available Educational Assistance</h1>
                        <p style="color: var(--text-muted); font-size: 14px;">Discover and apply for assistance programs that match your profile.</p>
                    </div>
                </header>

                <div class="page-layout-grid">

                    <section class="center-panel">

                        <div class="student-search-bar">
                            <div class="search-box" style="position: relative;">
                                <span style="position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--text-muted);"><i class="fa-solid fa-magnifying-glass"></i></span>
                                <input type="text" id="search-input" placeholder="Search available assistance..." style="padding-left: 40px; width: 100%; border-radius: 8px; border: 1px solid var(--border-color); padding-top: 12px; padding-bottom: 12px;">
                            </div>
                        </div>

                        <div class="result-count-label" style="margin-bottom: 15px; font-weight: 600; color: var(--text-main);">
                            <span id="result-count">0</span> Assistance Programs Found
                        </div>

                        <div class="scholarship-grid" id="scholarship-grid">
                            <!-- Injected via JS -->
                            <div style="padding: 40px; text-align: center; color: #64748b;"><i class="fa-solid fa-spinner fa-spin"></i> Loading educational assistance...</div>
                        </div>
                    </section>

                    <aside class="right-panel">

                        <div class="widget-card">
                            <div class="widget-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                                <h3 style="margin: 0; font-size: 16px; color: var(--text-main);">Refine Your Search</h3>
                                <a href="#" id="clear-filters" style="font-size: 12px; color: var(--primary-color); font-weight: 600;">Clear all</a>
                            </div>

                            <label class="widget-label" style="display: block; font-size: 12px; font-weight: 600; margin-bottom: 6px; color: var(--text-muted);">Category</label>
                            <select id="side-filter-category" class="widget-select" style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border-color); margin-bottom: 15px; background: #f8fafc; font-size: 14px;">
                                <option value="">All Categories</option>
                                <option value="Institution-Funded Educational Assistance">Institution-Funded</option>
                                <option value="Ched Educational Assistance">CHED Assistance</option>
                                <option value="Private Educational Assistance">Private Assistance</option>
                                <option value="Government Educational Assistance">Government Assistance</option>
                            </select>

                            <label class="widget-label" style="display: block; font-size: 12px; font-weight: 600; margin-bottom: 6px; color: var(--text-muted);">Program</label>
                            <select id="side-filter-program" class="widget-select" style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border-color); margin-bottom: 15px; background: #f8fafc; font-size: 14px;">
                                <option value="">All Programs</option>
                                <option value="Bachelor of Science in Accountancy">Bachelor of Science in Accountancy</option>
                                <option value="Bachelor of Science in Business Administration, Major in Financial Management">Bachelor of Science in Business Administration, Major in Financial Management</option>
                                <option value="Bachelor of Science in Hospitality Management">Bachelor of Science in Hospitality Management</option>
                                <option value="Bachelor of Science in Tourism Management">Bachelor of Science in Tourism Management</option>
                                <option value="Bachelor of Elementary Education">Bachelor of Elementary Education</option>
                                <option value="Bachelor of Secondary Education, Major in English">Bachelor of Secondary Education, Major in English</option>
                                <option value="Bachelor of Secondary Education, Major in Mathematics">Bachelor of Secondary Education, Major in Mathematics</option>
                                <option value="Bachelor of Secondary Education, Major in Filipino">Bachelor of Secondary Education, Major in Filipino</option>
                                <option value="Bachelor of Secondary Education, Major in Science">Bachelor of Secondary Education, Major in Science</option>
                                <option value="Bachelor of Secondary Education, Major in Social Studies">Bachelor of Secondary Education, Major in Social Studies</option>
                                <option value="Bachelor of Science in Information Technology">Bachelor of Science in Information Technology</option>
                                <option value="Bachelor of Science in Criminology">Bachelor of Science in Criminology</option>
                                <option value="Bachelor of Science in Psychology">Bachelor of Science in Psychology</option>
                            </select>

                            <label class="widget-label" style="display: block; font-size: 12px; font-weight: 600; margin-bottom: 6px; color: var(--text-muted);">Year Level</label>
                            <select id="side-filter-year" class="widget-select" style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border-color); margin-bottom: 20px; background: #f8fafc; font-size: 14px;">
                                <option value="">All Year Levels</option>
                                <option value="Incoming 1st Year">Incoming 1st Year</option>
                                <option value="1st Year">1st Year</option>
                                <option value="2nd Year">2nd Year</option>
                                <option value="3rd Year">3rd Year</option>
                                <option value="4th Year">4th Year</option>
                            </select>

                            <button id="apply-filters-btn" class="btn-primary" style="width: 100%; padding: 10px; border-radius: 8px; font-weight: 600; justify-content: center;">Apply Filters</button>
                        </div>

                        <div class="widget-card mt-24" style="margin-top: 24px;">
                            <h3 style="margin: 0 0 16px 0; font-size: 16px; color: var(--text-main);">Quick Links</h3>
                            <div style="display: flex; flex-direction: column; gap: 12px;">
                                <a href="student-applications.html" class="quick-link" style="display: flex; justify-content: space-between; align-items: center; padding: 12px; background: #f8fafc; border-radius: 8px; color: var(--text-main); font-weight: 500; transition: 0.2s;">
                                    <span><i class="fa-solid fa-file-lines" style="color: var(--primary-color); margin-right: 8px;"></i> My Applications</span> <i class="fa-solid fa-chevron-right" style="color: var(--text-muted); font-size: 12px;"></i>
                                </a>
                                <a href="student-profile-settings.html" class="quick-link" style="display: flex; justify-content: space-between; align-items: center; padding: 12px; background: #f8fafc; border-radius: 8px; color: var(--text-main); font-weight: 500; transition: 0.2s;">
                                    <span><i class="fa-solid fa-user-pen" style="color: #3b82f6; margin-right: 8px;"></i> Update Profile</span> <i class="fa-solid fa-chevron-right" style="color: var(--text-muted); font-size: 12px;"></i>
                                </a>
                            </div>
                        </div>

                    </aside>

                </div>
            </div>
        </main>
    </div>

    <!-- MOBILE SIDEBAR OVERLAY -->
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <!-- SCRIPTS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <!-- Use sidebar-loader for the common UI components like the dropdown & logout modal -->
    <script src="js/sidebar-loader.js"></script>
    <script src="js/student-scholarships.js"></script>

</body>
</html>
